name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: workflow and repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Analyze workflow security without CodeQL
        run: zizmor --offline --format plain .github/workflows
      - name: Check release and integration shell entrypoints
        run: shellcheck .github/workflows/release_prep.sh tools/verify_integrations.sh
      - name: Check repository policies and SBOM tooling
        run: python -m pytest tools/repository_policy_test.py tools/sbom_enrich_test.py
