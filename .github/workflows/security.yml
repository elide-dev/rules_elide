name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: workflow and repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned validation tools
        run: python -m pip install -r requirements-dev.txt
      - name: Analyze workflow security without CodeQL
        run: zizmor --offline --format plain .github/workflows
      - name: Check release and integration shell entrypoints
        run: shellcheck .github/workflows/release_prep.sh tools/verify_integrations.sh
      - name: Check repository policies and SBOM tooling
        run: python -m pytest tools/repository_policy_test.py tools/sbom_enrich_test.py tools/python_launcher_test.py
