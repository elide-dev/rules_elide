name: ci

on:
  push:
    branches: [main]
  # No base-branch filter: PRs stacked on another PR's branch get CI too.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Preserve long integration runs on main; newer pushes queue behind them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    name: tests (bazel ${{ matrix.bazel }} / ${{ matrix.os }})
    # Skip only same-repo release-please PRs: they touch CHANGELOG/version files
    # only and are re-validated on main after merge. The `event_name ==
    # 'pull_request'` guard means push/schedule never read pull_request fields,
    # and the same-repo check stops a fork PR from skipping CI by naming its
    # branch `release-please--*`. (Same guard on the other PR jobs below.)
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Bazel 8+ only (protobuf 35.x requires >=8.0.0; see MODULE.bazel
        # bazel_compatibility).
        bazel: ["8.x", "9.x"]
        os: [ubuntu-24.04]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ci-${{ matrix.bazel }}-${{ matrix.os }}
          repository-cache: true
      - name: bazel test //tests:all
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        run: bazel test //tests:all --config=ci

  tests-macos:
    name: tests (bazel ${{ matrix.bazel }} / macos-arm64-cipool)
    # Self-hosted pool: main pushes and same-repository PRs only, never forks
    # (see docs/security-model.md). Release-please PRs are skipped as above.
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.head_ref, 'release-please--'))
    runs-on: macos-arm64-cipool
    strategy:
      fail-fast: false
      matrix:
        bazel: ["8.x", "9.x"]
    steps:
      # No harden-runner here: it does not support self-hosted macOS runners.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          # The self-hosted Mac has no bazel on PATH; install bazelisk (as benchmarks.yml does).
          bazelisk-version: 1.30.0
          bazelisk-cache: true
          disk-cache: ci-${{ matrix.bazel }}-macos-arm64-cipool
          repository-cache: true
      - name: bazel test //tests:all
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        # The runner's JAVA_HOME (a GraalVM JDK without bin/java) breaks Bazel's local JDK
        # autoconfiguration; use the hermetic remote JDK as AGENTS.md prescribes.
        run: >-
          bazel test //tests:all --config=ci
          --java_runtime_version=remotejdk_21
          --tool_java_runtime_version=remotejdk_21

  e2e:
    name: e2e smoke (analysis)
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ci-e2e
          repository-cache: true
      - name: bazel build //... --nobuild
        working-directory: e2e/smoke
        run: bazel build //... --nobuild

  lint:
    name: lint (pre-commit)
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pre-commit run --all-files --show-diff-on-failure

  docs-freshness:
    name: docs freshness
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ci-docs
          repository-cache: true
      - name: regenerate docs
        run: ./tools/update_docs.sh
      - name: assert docs are up to date
        run: git diff --exit-code -- docs/

  integration:
    name: integration (real elide toolchain)
    runs-on: ubuntu-24.04
    # Downloads the Elide distribution and Python overlay. Runs on PRs too:
    # analysis tests cannot see real compiler output or verifier drift.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--')) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ci-integration
          repository-cache: true
      - name: KotlinBuilder, JavaBuilder and native worker protocol tests
        run: bazel test //tests/kotlin_builder:all //tests/java_builder:all //elide/private/ic_worker:worker_protocol_test --java_runtime_version=remotejdk_21 --tool_java_runtime_version=remotejdk_21
      - name: JavaBuilder shim e2e (java_library through elide javac)
        run: ./tools/verify_integrations.sh java_builder
      - name: JVM tools, metadata, and pruning
        run: ./tools/verify_integrations.sh jvm
      - name: Python runtime adapter
        run: ./tools/verify_integrations.sh python

  kotlin-builder:
    name: kotlin-builder e2e (rules_kotlin toolchain swap)
    runs-on: ubuntu-24.04
    # Same gate as `integration`: downloads the Elide binary and validates
    # actual compilation through the KotlinBuilder shim, on PRs and main.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--')) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ci-kotlin-builder
          repository-cache: true
      - name: Native ABI, KAPT, KSP2, and standalone processors
        run: ./tools/verify_integrations.sh kotlin

  rbe:
    name: rbe (BuildBuddy)
    runs-on: ubuntu-24.04
    # Needs the BUILDBUDDY_API_KEY secret, which GitHub does not expose to fork
    # PRs — gate to same-repo events (main pushes + same-repo PRs). Like
    # `integration`, this also downloads the elide binary at repo-rule time.
    if: >-
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab  # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ci-rbe
          repository-cache: true
      - name: Configure BuildBuddy API key
        working-directory: e2e/rbe
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        # Inject the key the way .bazelrc's try-import expects. Written to a file
        # (never echoed) so it stays out of the build log.
        run: |
          set -euo pipefail
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "BUILDBUDDY_API_KEY secret is empty — cannot run RBE." >&2
            exit 1
          fi
          printf 'common --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_API_KEY}" > user.bazelrc
      - name: bazel test //... --config=remote
        working-directory: e2e/rbe
        # Full remote: cache + execution + BES. Bazel prints the BuildBuddy
        # invocation URL (from --bes_results_url) at the top of the run.
        run: bazel test //... --config=remote --config=ci
      - name: Native Kotlin IC compile and runtime over RBE
        working-directory: e2e/rbe
        run: bazel test //:KotlinTest --config=remote --config=ci --@rules_elide//config/kotlinc:incremental=true
