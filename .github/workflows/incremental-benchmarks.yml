name: Incremental benchmarks

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Source workload (production fixtures select their language)
        type: choice
        options: [generated, commons-lang, kotlin-builder]
        default: generated
      modes:
        description: Optional space-separated modes (empty uses the standard matrix)
        type: string
        default: ""
      profiles:
        description: Retain traces and sampled memory/critical-path metrics
        type: boolean
        default: false
      language:
        description: Language comparison to run
        type: choice
        options: [both, java, kotlin]
        default: both
      sources:
        description: Sources in the core module (at least 3)
        type: number
        default: 20
      rounds:
        description: Measured rounds per edit, language, and mode
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: incremental-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: dependency graph edit matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out production library sources
        if: inputs.workload == 'commons-lang'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apache/commons-lang
          ref: 67cbf817b6af58fc168d26774186e889bb9efe50
          path: .benchmark-sources/commons-lang
          persist-credentials: false
      - name: Install runtime for consumer assertions
        if: inputs.workload == 'commons-lang'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: true
      - name: Validate benchmark helpers
        run: python3 -m unittest discover -s benchmarks -p "*_test.py"
      - name: Measure incremental edits and action propagation
        env:
          WORKLOAD: ${{ inputs.workload }}
          MODES: ${{ inputs.modes }}
          PROFILES: ${{ inputs.profiles }}
          LANGUAGE: ${{ inputs.language }}
          SOURCES: ${{ inputs.sources }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          args=()
          if [[ -n "$MODES" ]]; then
            read -r -a selected_modes <<< "$MODES"
            args+=(--modes "${selected_modes[@]}")
          fi
          if [[ "$PROFILES" == true ]]; then args+=(--profiles); fi
          if [[ "$WORKLOAD" == commons-lang ]]; then
            args+=(--languages java --commons-lang .benchmark-sources/commons-lang)
          elif [[ "$WORKLOAD" == kotlin-builder ]]; then
            args+=(--languages kotlin --kotlin-builder)
          elif [[ "$LANGUAGE" != both ]]; then
            args+=(--languages "$LANGUAGE")
          fi
          python3 benchmarks/incremental_matrix.py --sources "$SOURCES" --rounds "$ROUNDS" "${args[@]}"
      - name: Preserve timings and execution logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: incremental-benchmark-results
          path: benchmarks/results/incremental/
          retention-days: 30
