name: scorecards

on:
  branch_protection_rule:
  schedule:
    - cron: "32 4 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: scorecards analysis
    # OpenSSF Scorecards requires public-repo GraphQL access. Skip the job
    # while the repository is private (the token would 403 on ListCommits).
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          # Source archives omit .github via export-ignore; inspect the Git tree.
          file_mode: git
          results_file: results.json
          results_format: json
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openssf-scorecard
          path: results.json
          retention-days: 30
